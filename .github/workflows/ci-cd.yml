name: CI/CD Pipeline - Vietnam Quoc Tu Free Audio Guide

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name: Automated Testing & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python Môi trường (Bắt buộc cho Spatial Engine)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Typecheck & Linter
        run: npm run lint

      - name: Execute Backend & Spatial Geofence Tests
        run: npm test

      # Đảm bảo frontend Vite build thành công trước khi kích hoạt deploy
      - name: Build Frontend & Production Bundle
        run: npm run build

  trigger-render-deploy:
    name: Trigger Render Live Deployment
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Call Render Deploy Webhook
        run: |
          echo "🚀 Code SẠCH 100%! Đang kích hoạt Render Deploy Webhook..."
          curl -f -s -S -X POST "${{ secrets.RENDER_DEPLOY_WEBHOOK }}"